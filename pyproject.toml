[project]
name = "audiorec"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "PyAudioWPatch",
    "lameenc",
    "numpy",
    "PySide6",
    "pyqtgraph",
    "sounddevice",
    "soundfile",
    "mutagen",
    "imageio-ffmpeg",
]

[dependency-groups]
dev = [
    "pyfatfs>=1.1.0",
    "pytest",
    "pytest-qt",
    "setuptools<81",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
